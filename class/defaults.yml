parameters:
  openshift4_config:
    =_metadata:
      multi_tenant: true
    globalPullSecrets: {}
    caBundle: null
    cloud: null

    vsphere:
      vcenterURL: null
      username: null
      password: null

    motd:
      messages: {}
      include_console_notifications: false

    etcdCustomization:
      enabled: false
      spec:
        controlPlaneHardwareSpeed: ""

    pullSecretCustomization:
      enabled: true
      label: 'pull-secret.openshift-config.syn.tools/include'
      auths: {}

    networkCustomization:
      enabled: true
      labelConfig: 'network.openshift-config.syn.tools/include-config'
      labelOperator: 'network.openshift-config.syn.tools/include-operator'
      specConfig: {}
      specOperator: {}
