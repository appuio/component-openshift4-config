parameters:
  openshift4_config:
    =_metadata:
      multi_tenant: true
    globalPullSecrets: {}
    caBundle: null
    cloud: null

    vsphere:
      vcenterURL: null
      username: null
      password: null

    images:
      oc:
        registry: quay.io
        repository: appuio/oc
        tag: v4.21

    motd:
      messages: {}
      include_console_notifications: false

    etcdCustomization:
      enabled: false
      spec:
        controlPlaneHardwareSpeed: ""

    networkCustomization:
      enabled: true
      labelConfig: 'network.openshift-config.syn.tools/include-config'
      labelOperator: 'network.openshift-config.syn.tools/include-operator'
      specConfig: {}
      specOperator: {}
