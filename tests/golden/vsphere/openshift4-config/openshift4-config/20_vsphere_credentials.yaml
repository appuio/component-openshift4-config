apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  labels:
    app.kubernetes.io/name: vsphere-credentials
  name: vsphere-credentials
  namespace: openshift-config
spec:
  applyOptions:
    force: true
  context:
    - name: source
      resource:
        apiVersion: v1
        kind: Secret
        name: appuio-vsphere-creds
        namespace: openshift-config
  serviceAccountRef:
    name: vsphere-credentials-manager
  template: |
    local esp = import 'espejote.libsonnet';

    local source = esp.context().source;
    assert
      std.length(source) == 1
      : 'Expected source context to have exactly 1 element';
    assert
      source[0].kind == 'Secret'
      : 'Expected source to be a `Secret`, is a `%s`' % source[0].kind;

    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: 'vsphere-creds',
        namespace: 'kube-system',
        annotations: {
          'espejote.io/managed-by': 'openshift-config/vsphere-credentials',
        },
      },
      data: source[0].data,
    }
  triggers:
    - name: vsphere-creds
      watchResource:
        apiVersion: v1
        kind: Secret
        name: vsphere-creds
        namespace: kube-system
    - name: source
      watchContextResource:
        name: source
---
apiVersion: v1
data: {}
kind: Secret
metadata:
  annotations: {}
  labels:
    name: appuio-vsphere-creds
  name: appuio-vsphere-creds
  namespace: openshift-config
stringData:
  vcenter.example.com.password: t-silent-test-1234/c-green-test-1234/vsphere/credentials/password
  vcenter.example.com.username: t-silent-test-1234/c-green-test-1234/vsphere/credentials/username
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  labels:
    name: vsphere-credentials-manager
  name: vsphere-credentials-manager
  namespace: openshift-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations: {}
  labels:
    name: vsphere-credentials-manager
  name: vsphere-credentials-manager
  namespace: kube-system
rules:
  - apiGroups:
      - ''
    resourceNames:
      - vsphere-creds
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations: {}
  labels:
    name: vsphere-credentials-manager
  name: vsphere-credentials-manager
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vsphere-credentials-manager
subjects:
  - kind: ServiceAccount
    name: vsphere-credentials-manager
    namespace: openshift-config
