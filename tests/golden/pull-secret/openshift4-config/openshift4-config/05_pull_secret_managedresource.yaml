apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    name: appuio-pull-secret-manager
  name: appuio-pull-secret-manager
  namespace: openshift-config
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    name: appuio-openshift4-config-pull-secret-manager
  name: appuio:openshift4-config:pull-secret-manager
  namespace: openshift-config
rules:
  - apiGroups:
      - ''
    resourceNames:
      - pull-secret
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - espejote.io
    resourceNames:
      - appuio-pull-secret
    resources:
      - jsonnetlibraries
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    name: appuio-openshift4-config-pull-secret-manager
  name: appuio:openshift4-config:pull-secret-manager
  namespace: openshift-config
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: appuio:openshift4-config:pull-secret-manager
subjects:
  - kind: ServiceAccount
    name: appuio-pull-secret-manager
    namespace: openshift-config
---
apiVersion: espejote.io/v1alpha1
kind: JsonnetLibrary
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/name: appuio-pull-secret
  name: appuio-pull-secret
  namespace: openshift-config
spec:
  data:
    spec.json: |-
      {
          "pullSecrets": {
              "cloud.openshift.com": null,
              "ghcr.io": {
                  "auth": "t-silent-test-1234/c-green-test-1234/openshift4-config/pullSecrets/ghcr.io-pull-secret",
                  "email": "github@example.com"
              },
              "quay.io": null,
              "registry.example.com": {
                  "auth": "t-silent-test-1234/c-green-test-1234/openshift4-config/pullSecrets/registry.example.com-pull-secret"
              }
          }
      }
---
apiVersion: espejote.io/v1alpha1
kind: ManagedResource
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    syn.tools/description: |
      Merges the `auths` entries of every secret in namespace openshift-config
      with the include label into the cluster's global pull secret.
      Entries which aren't contributed by a labelled secret are left
      untouched.
  labels:
    app.kubernetes.io/name: appuio-pull-secret
  name: appuio-pull-secret
  namespace: openshift-config
spec:
  applyOptions:
    force: true
  context:
    - name: global_pull_secret
      resource:
        apiVersion: v1
        kind: Secret
        name: pull-secret
        namespace: openshift-config
    - name: source_secrets
      resource:
        apiVersion: v1
        kind: Secret
        labelSelector:
          matchLabels:
            pull-secret.openshift-config.syn.tools/include: ''
        namespace: openshift-config
  serviceAccountRef:
    name: appuio-pull-secret-manager
  template: |
    local esp = import 'espejote.libsonnet';

    local spec = import 'appuio-pull-secret/spec.json';

    local global_pull_secret =
      local gps = esp.context().global_pull_secret;
      assert std.length(gps) == 1 : "Expected 'global_pull_secret' context to have exactly one entry";
      assert
        std.objectHas(gps[0], 'data') && std.objectHas(gps[0].data, '.dockerconfigjson')
        : "Expected global pull secret ('openshift-config/pull-secret') to have field '.dockerconfigjson";
      std.parseJson(std.base64Decode(gps[0].data['.dockerconfigjson']));

    // Labelled secrets contributed by other components, merged in a stable order.
    local sources = std.sort(
      std.filter(
        function(s) s.type == 'kubernetes.io/dockerconfigjson',
        esp.context().source_secrets
      ),
      function(s) s.metadata.name
    );

    local authsOf(secret) =
      std.get(std.parseJson(std.base64Decode(secret.data['.dockerconfigjson'])), 'auths', {});

    local auths = std.foldl(
      function(a, b) a + b,
      // The entries from the hierarchy are merged last, so that the component
      // parameters take precedence over the labelled secrets.
      [ authsOf(s) for s in sources ] + [ spec.pullSecrets ],
      std.get(global_pull_secret, 'auths', {})
    );

    {
      apiVersion: 'v1',
      kind: 'Secret',
      metadata: {
        name: 'pull-secret',
        namespace: 'openshift-config',
        annotations: {
          'pull-secret.openshift-config.syn.tools/active-secrets':
            std.manifestJsonMinified([ s.metadata.name for s in sources ]),
        },
      },
      data: {
        '.dockerconfigjson': std.base64(std.manifestJsonMinified(global_pull_secret {
          // Entries with a `null` value are removed from the pull secret. Entries
          // which are present on the cluster but not contributed by any of the
          // merged secrets are kept as-is.
          auths: {
            [k]: std.prune(auths[k])
            for k in std.objectFields(auths)
            if auths[k] != null
          },
        })),
      },
    }
  triggers:
    - name: jsonnetlib
      watchResource:
        apiVersion: espejote.io/v1alpha1
        kind: JsonnetLibrary
        name: appuio-pull-secret
    - name: global_pull_secret
      watchContextResource:
        name: global_pull_secret
    - name: source_secrets
      watchContextResource:
        name: source_secrets
