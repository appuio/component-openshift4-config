parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-espejote/master/lib/espejote.libsonnet
        output_path: vendor/lib/espejote.libsonnet

  openshift4_config:
    globalPullSecrets:
      ghcr.io:
        email: github@example.com
        auth: ?{vaultkv:${cluster:tenant}/${cluster:name}/openshift4-config/pullSecrets/ghcr.io-pull-secret}
      quay.io: null
      # overridden through `pullSecretCustomization.auths` below
      registry.example.com:
        auth: from-alias
    pullSecretCustomization:
      auths:
        registry.example.com:
          auth: ?{vaultkv:${cluster:tenant}/${cluster:name}/openshift4-config/pullSecrets/registry.example.com-pull-secret}
        cloud.openshift.com: null
    caBundle: |
      -----BEGIN CERTIFICATE-----
      MY AWESOME CA
      -----END CERTIFICATE-----
